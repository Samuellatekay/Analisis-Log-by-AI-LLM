# Referensi pipeline Logstash untuk dokumen log via log_uuid.
input {
  http {
    port     => 8080
    codec    => json
    user     => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
  }
}
filter {
  mutate { remove_field => ["headers", "host", "url", "user_agent"] }
}
output {
  elasticsearch {
    hosts         => ["https://elasticsearch:9200"]
    index         => "analisis-log-%{log_day}"
    document_id   => "%{log_uuid}"
    action        => "update"
    doc_as_upsert => true
  }
}
