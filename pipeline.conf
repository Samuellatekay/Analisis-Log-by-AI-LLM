# Referensi pipeline Logstash: log mentah & hasil AI digabung ke 1 dokumen via log_uuid.
input {
  http {
    port     => 8080
    codec    => json
    user     => "${LOGSTASH_HTTP_USER}"
    password => "${LOGSTASH_HTTP_PASSWORD}"
  }
}
filter {
  mutate { remove_field => ["headers", "host", "url", "user_agent"] }
}
output {
  elasticsearch {
    hosts         => ["https://elasticsearch:9200"]
    index         => "soc-ai-logs-%{log_day}"   # log_day sama di dokumen mentah & AI
    document_id   => "%{log_uuid}"
    action        => "update"
    doc_as_upsert => true                       # merge parsial: raw + ai.* jadi satu dokumen
  }
}
