services:
  app:
    build: .
    image: analisis-log:local
    env_file: .env
    environment:
      - IRIS_CA_CERT=/app/iris-ca.crt
      - RISK_ENGINE_URL=http://192.168.51.39:8000
      - RISK_STRATEGY=ahp_2026
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    extra_hosts:
      - "iris.local:192.168.51.40"
      - "soc-risk-engine:192.168.51.39"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    volumes:
      - /etc/ssl/custom/iris-ca.pem:/app/iris-ca.crt:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  iris-stream:
    build: .
    image: analisis-log:local
    command: ["python", "stream_iris.py"]
    env_file: .env
    environment:
      - IRIS_CA_CERT=/app/iris-ca.crt
    restart: unless-stopped
    extra_hosts:
      - "iris.local:192.168.51.40"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    ports:
      - "${IRIS_STREAM_BIND:-127.0.0.1}:${IRIS_STREAM_HTTP_PORT:-17771}:${IRIS_STREAM_HTTP_PORT:-17771}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:17771/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    volumes:
      - /etc/ssl/custom/iris-ca.pem:/app/iris-ca.crt:ro
    # 🆕 SERVICE BARU: Penerima Data dari VM Lain (Port 17772)
  stream-receiver:
    build: .
    image: analisis-log:local
    command: ["python", "stream_receiver.py"]
    env_file: .env
    environment:
      - IRIS_CA_CERT=/app/iris-ca.crt
    restart: unless-stopped
    extra_hosts:
      - "iris.local:192.168.51.40"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    volumes:
      - /etc/ssl/custom/iris-ca.pem:/app/iris-ca.crt:ro

volumes:
  pgdata:
  redisdata:

networks:
  internal: