services:
  app:
    build: .
    env_file: .env
    environment:
      - IRIS_CA_CERT=/app/iris-ca.crt
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
#      redis: { condition: service_started }
    extra_hosts:
      - "iris.local:192.168.51.40"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    # Scale horizontal saat burst:  docker compose up -d --scale app=3
    volumes:
      - /etc/ssl/custom/iris-ca.pem:/app/iris-ca.crt:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]          # sengaja tanpa 'ports' (tidak diekspos ke host)

#  redis:                          # hapus jika memakai Redis milik Collector yang sudah ada
#    image: redis:7-alpine
#    restart: unless-stopped
#    command: >
#      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
#      --maxmemory 512mb --maxmemory-policy noeviction
#    volumes: [redisdata:/data]
#    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal: